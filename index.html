<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In C: The Audience Ensemble</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Score Projection -->
    <section id="score-section">
      <canvas id="score-canvas"></canvas>
    </section>

    <!-- Button Stations -->
    <section id="button-section">
      <div id="button-row"></div>
      <div id="demo-row">
        <button id="btn-play-demo" class="demo-play-btn" aria-label="Play Demo">
          <svg class="demo-icon-play" viewBox="0 0 48 48" width="36" height="36">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <polygon points="19,14 19,34 35,24" fill="currentColor"/>
          </svg>
          <svg class="demo-icon-pause" viewBox="0 0 48 48" width="36" height="36" style="display:none">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="16" y="14" width="5" height="20" fill="currentColor"/>
            <rect x="27" y="14" width="5" height="20" fill="currentColor"/>
          </svg>
          <span class="demo-label">Demo</span>
        </button>
      </div>
    </section>

    <!-- Status Bar -->
    <div id="status-bar">
      <div class="status-item">
        <span class="status-label">BPM</span>
        <span class="status-value" id="status-bpm">120</span>
      </div>
      <div class="status-item">
        <span class="status-label">Spread</span>
        <span class="status-value" id="status-spread">0 / 5</span>
      </div>
      <div class="status-item">
        <span class="status-label">Range</span>
        <span class="status-value" id="status-range">1 - 1</span>
      </div>
      <div class="status-item">
        <span class="status-label">Mode</span>
        <span class="status-value" id="status-mode">Stopped</span>
      </div>
      <div class="status-item">
        <span class="status-label">Beat</span>
        <span class="status-value" id="status-beat">-</span>
      </div>
      <a href="admin.html" class="status-item admin-link">Admin</a>
    </div>

    <!-- Operator Panel -->
    <div id="operator-panel">
      <div id="operator-content">
        <h2>Operator Panel</h2>

        <div class="op-section">
          <h3>Transport</h3>
          <div class="op-row">
            <button class="op-btn primary" id="op-start">Start</button>
            <button class="op-btn" id="op-pause">Pause</button>
            <button class="op-btn" id="op-reset">Reset</button>
          </div>
        </div>

        <div class="op-section">
          <h3>Configuration</h3>
          <div class="op-row">
            <label>BPM</label>
            <input type="number" id="op-bpm" value="120" min="40" max="240">
          </div>
          <div class="op-row">
            <label>Total Units (N)</label>
            <input type="number" id="op-units" value="53" min="5" max="100">
          </div>
          <div class="op-row">
            <label>Max Spread</label>
            <input type="number" id="op-spread" value="5" min="1" max="20">
          </div>
          <div class="op-row">
            <label>End Behavior</label>
            <select id="op-end-behavior">
              <option value="wrap" selected>Wrap</option>
              <option value="hold">Hold</option>
              <option value="resetAll">Reset All</option>
            </select>
          </div>
        </div>

        <div class="op-section">
          <h3>Demo Mode</h3>
          <div class="op-row">
            <label>Auto-play</label>
            <button class="op-btn" id="op-demo">Off</button>
          </div>
        </div>

        <p class="op-hint">Press Escape to close. Press D to toggle demo mode. Keys 1-0 control musicians.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
